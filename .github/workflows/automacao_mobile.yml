name: Mobile Automation CI

on:
  workflow_dispatch:
  push:
    # branches:
    #   - main
  pull_request:
    branches:
      - main

env:
  ANDROID_AVD: emulator

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout do código
        uses:  actions/checkout@v4

      # - name: Install Java 21
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'zulu'
      #     java-version: '21'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Add avdmanager and sdkmanager to system PATH
        run: |
            echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}" >> $GITHUB_PATH

      - name: Install Sdk
        run: |
           yes Y | sdkmanager --licenses
           sdkmanager --install ${ANDROID_SDK_PACKAGES}
  
      - name: Build emulator
        run: |
            echo "no" | avdmanager --verbose create avd --force -n $EMULATOR_NAME --abi "${ANDROID_TARGET}/${ANDROID_ARCH}" -k "system-images;android-${API_LEVEL};${ANDROID_TARGET};${ANDROID_ARCH}"

      - name: Env vars
        run: |
          # export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          echo $ANDROID_HOME
          adb devices
          ls -l $ANDROID_HOME
          ls -l $ANDROID_HOME/platform-tools
      
      - name: Appium Install
        run: |
          npm install -g appium
          # appium setup
          appium driver install uiautomator2

      - name: Appium Doctor
        run: |
          appium driver doctor uiautomator2

      - name: Robot Framework Install
        run: pip install robotframework robotframework-appiumlibrary

      
          
      # - name: 🚀 Iniciar Appium Server
      #   run: appium --log-level error > appium.log 2>&1 &

